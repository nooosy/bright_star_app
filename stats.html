<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161520">
<title>밝은 별.</title>
<style>
:root{--bg-top:#161520;--bg-bottom:#3271A6;--line:#7e7e7e;--sub:#7e7e7e;--spring:cubic-bezier(.34,1.56,.64,1);--hi:#ffb347;--c1:#6fb4ff;--c2:#b78cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overscroll-behavior:none}
body{display:flex;justify-content:center;color:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;width:428px;height:926px;max-height:100dvh;overflow:hidden;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 40%,var(--bg-bottom) 100%)}
.view{position:absolute;inset:0 0 84px 0;padding:94px 21px 40px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
h1{font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.date{font-size:14px;font-weight:600;color:#cfd6ee;margin:0 0 20px 2px}
.chips{display:flex;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.chips button{height:38px;padding:0 20px;border:1.5px solid var(--line);border-radius:19px;font-size:14px;font-weight:700;color:var(--sub);transition:all .25s}
.chips button.on{border-color:#fff;color:#fff}
.chips.sm button{height:32px;padding:0 16px;border-radius:16px;font-size:13px}
.chips.last{margin-bottom:28px}
.flabel{font-size:12px;font-weight:600;color:#cfd6ee;margin:0 0 8px 2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.stat{border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:18px;background:rgba(255,255,255,.04)}
.stat span{font-size:12px;font-weight:600;color:#cfd6ee}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.3px}
.card{border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:20px 16px 18px;margin-bottom:28px;background:rgba(255,255,255,.04)}
.ct{font-size:15px;font-weight:700;color:#fff;margin:0 4px 6px}
.cs{font-size:12px;font-weight:600;color:var(--sub);margin:0 4px 20px;line-height:1.6}
.empty{font-size:13px;font-weight:600;color:var(--sub);text-align:center;padding:44px 0}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;fill:#9aa3c0;font-size:10px;font-weight:600}
svg .v{fill:#e6eaff;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 4px 0;font-size:12px;font-weight:600;color:#cfd6ee}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.sels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.sel{position:relative}
.sel select{width:100%;height:40px;appearance:none;-webkit-appearance:none;border-width:1.5px;border-style:solid;border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:0 28px 0 12px;outline:0}
.sel select option{color:#000}
.sel::after{content:'';position:absolute;right:12px;top:14px;width:7px;height:7px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(45deg);pointer-events:none}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;z-index:6;border-top:1px solid rgba(255,255,255,.18);background:rgba(15,15,25,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding-bottom:12px;color:var(--sub);font-size:12px;font-weight:700;text-decoration:none}
.tab.on{color:#fff}
.tab:active svg{transform:scale(.88)}
.tab svg{width:26px;height:26px;transition:transform .25s var(--spring)}
</style>
</head>
<body>
<main class="app">
  <div class="view" id="view">
    <h1>통계</h1>
    <p class="date" id="date">불러오는 중…</p>
    <div class="flabel">기간</div>
    <div class="chips" id="chips"><button type="button" data-r="7" class="on">7일</button><button type="button" data-r="30">30일</button><button type="button" data-r="90">90일</button><button type="button" data-r="0">전체</button></div>
    <div class="flabel">요일</div>
    <div class="chips sm last" id="dchips"><button type="button" data-d="all" class="on">전체</button><button type="button" data-d="weekday">주말 제외</button><button type="button" data-d="weekend">주말만</button></div>
    <div id="sections"></div>
  </div>
  <nav class="tabs">
    <a class="tab" id="tab-home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
    <a class="tab on" href="stats.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>통계</a>
    <a class="tab" href="predict.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>예측</a>
  </nav>
</main>
<script>
const CFG_FALLBACK={url:'',key:'',table:'sleep_records'};
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const pad2=n=>String(n).padStart(2,'0');
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const CFG=Object.assign({},CFG_FALLBACK,LS.get('sleep.cfg',{}));
const ready=!!CFG.url&&!!CFG.key&&!CFG.url.includes('YOUR-PROJECT');
const homeHref=(CFG.home&&CFG.home!=='./')?CFG.home:(CFG.home==='./'?'./':'index.html');
$('#tab-home').href=homeHref;
const SLOTS=[['wake','기상 직후'],['morning','아침'],['afternoon','오후'],['evening','저녁']];
const NS='http://www.w3.org/2000/svg';
const svgEl=(t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e};

/* ───── 데이터 ───── */
async function token(){
  const a=LS.get('sleep.auth',null);if(!a)return null;
  if(a.expires_at-60>Date.now()/1000)return a.access_token;
  try{
    const r=await fetch(`${CFG.url}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:a.refresh_token})});
    if(!r.ok)return null;const j=await r.json();
    LS.set('sleep.auth',{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)});
    return j.access_token;
  }catch(e){return null}
}
function collect(remote){
  const m=new Map();[...(remote||[]),...LS.get('sleep.records',[])].forEach(r=>{if(r&&r.saved)m.set(r.saved,r)});return [...m.values()];
}
async function load(){
  let remote=LS.get('sleep.cache',[]);
  if(ready){
    try{
      const t=await token();
      if(t){
        const r=await fetch(`${CFG.url}/rest/v1/${CFG.table||'sleep_records'}?select=data&order=saved_at.desc&limit=1000`,{headers:{apikey:CFG.key,Authorization:'Bearer '+t}});
        if(r.ok){remote=(await r.json()).map(x=>x.data).filter(Boolean);LS.set('sleep.cache',remote)}
      }else if(!LS.get('sleep.auth',null)){location.replace(homeHref);return null}
    }catch(e){console.warn('불러오기 실패',e)}
  }
  return collect(remote);
}
function analyze(r){
  const w=r.finalWake||r.naturalWake;if(!w||!r.bedTime)return null;
  const bed=new Date(r.bedTime),[h,mi]=w.split(':').map(Number);if(isNaN(h))return null;
  const wk=new Date(bed);wk.setHours(h,isNaN(mi)?0:mi,0,0);if(wk<=bed)wk.setDate(wk.getDate()+1);
  const min=Math.round((wk-bed)/60000);if(min<=0||min>=24*60)return null;
  return{bed,wake:wk,min,r};
}
function dedupeSleep(list){
  const T=x=>+new Date(x);
  return list.filter(r=>{
    if(!r||!r.saved)return false;
    const sv=T(r.saved);
    return !list.some(o=>o!==r&&o.bedTime&&T(o.bedTime)>=sv-1000&&T(o.bedTime)<=sv+10000&&o.awakenings!=null&&r.awakenings==null);
  });
}
function logicalDay(r){
  if(r.logicalDay)return r.logicalDay;
  const d=new Date(+new Date(r.saved)-5*3600e3);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function buildDays(list){
  const days=new Map(),now=new Date();
  const get=k=>{if(!days.has(k)){const [Y,M,D]=k.split('-').map(Number);days.set(k,{day:new Date(Y,M-1,D),sleep:null,sum:null})}return days.get(k)};
  list.filter(r=>r&&r.saved&&r.fatigue).forEach(r=>{const e=get(logicalDay(r));if(!e.sum||String(r.saved)>String(e.sum.saved))e.sum=r});
  dedupeSleep(list).map(analyze).filter(a=>a&&a.wake<=now).forEach(a=>{
    const k=a.wake.getFullYear()+'-'+pad2(a.wake.getMonth()+1)+'-'+pad2(a.wake.getDate()),e=get(k);
    if(!e.sleep||String(a.r.saved)>String(e.sleep.r.saved))e.sleep=a});
  return days;
}
let ALL=[],range=7,dayType='all';
const isWeekend=d=>d.getDay()===0||d.getDay()===6;
/* skipType=true면 요일 필터를 무시(평일/주말 비교용) */
const rows=(skipType)=>{
  let A=[...buildDays(ALL).values()].map(e=>({day:e.day,bed:e.sleep?e.sleep.bed:null,wake:e.sleep?e.sleep.wake:null,min:e.sleep?e.sleep.min:null,r:e.sum||(e.sleep&&e.sleep.r)})).sort((a,b)=>a.day-b.day);
  if(range){const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-(range-1));A=A.filter(a=>a.day>=lim)}
  if(!skipType){
    if(dayType==='weekday')A=A.filter(a=>!isWeekend(a.day));
    else if(dayType==='weekend')A=A.filter(a=>isWeekend(a.day));
  }
  return A;
};
const fmtMin=m=>`${pad2(Math.floor(m/60)%24)}:${pad2(Math.round(m)%60)}`;
const dur=m=>`${Math.floor(m/60)}시간 ${Math.round(m%60)}분`;
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const dlabel=d=>(d.getMonth()+1)+'/'+d.getDate();
const fmtH=m=>{const h=m/60;return (Number.isInteger(h)?h:h.toFixed(1))+'h'};

/* ───── 차트 부품 ───── */
const W=354;
function trendChart(host,pts,{guide,guideLabel,tickStep=60,hiColor='#ffb347',color='#6fb4ff',fmt=fmtMin}={}){
  host.innerHTML='';
  if(!pts.length){host.innerHTML='<div class="empty">기록이 쌓이면 여기에 표시돼요</div>';return}
  const H=190,L=40,R=10,T=14,B=26,iw=W-L-R,ih=H-T-B;
  let lo=Math.min(...pts.map(p=>p.y),guide??1e9),hi=Math.max(...pts.map(p=>p.y),guide??-1e9);
  lo=Math.floor(lo/tickStep)*tickStep-tickStep/2;hi=Math.ceil(hi/tickStep)*tickStep+tickStep/2;
  const X=i=>L+(pts.length===1?iw/2:iw*i/(pts.length-1)),Y=v=>T+ih*(v-lo)/(hi-lo);
  const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
  for(let v=Math.ceil(lo/tickStep)*tickStep;v<=hi;v+=tickStep){
    s.append(svgEl('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:'rgba(255,255,255,.1)'}));
    s.append(svgEl('text',{x:L-6,y:Y(v)+3,'text-anchor':'end'},fmt(v)));
  }
  if(guide!=null){
    s.append(svgEl('line',{x1:L,x2:W-R,y1:Y(guide),y2:Y(guide),stroke:hiColor,'stroke-dasharray':'4 4',opacity:.7}));
    s.append(svgEl('text',{x:W-R,y:Y(guide)-4,'text-anchor':'end',style:`fill:${hiColor}`},guideLabel||''));
  }
  s.append(svgEl('polyline',{points:pts.map((p,i)=>`${X(i)},${Y(p.y)}`).join(' '),fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round',opacity:.55}));
  const every=Math.max(1,Math.ceil(pts.length/7));
  pts.forEach((p,i)=>{
    s.append(svgEl('circle',{cx:X(i),cy:Y(p.y),r:p.hi?5:4,fill:p.hi?hiColor:color}));
    if(pts.length<=10)s.append(svgEl('text',{x:X(i),y:Y(p.y)-9,'text-anchor':'middle',class:'v'},p.label||fmt(p.y)));
    if(i%every===0||i===pts.length-1)s.append(svgEl('text',{x:X(i),y:H-6,'text-anchor':'middle'},dlabel(p.x)));
  });
  host.append(s);
}
/* 기분 차트: series=[{avgs:[4개 평균 or null], color}] — 한 좌표축에 여러 선 */
function moodChart(host,series,w=W){
  host.innerHTML='';
  const H=200,L=14,R=14,T=16,B=30,iw=w-L-R,ih=H-T-B;
  const X=i=>L+iw*i/3,Y=v=>T+ih*(v-1)/4;
  const s=svgEl('svg',{viewBox:`0 0 ${w} ${H}`});
  for(let v=1;v<=5;v++){
    s.append(svgEl('line',{x1:L,x2:w-R,y1:Y(v),y2:Y(v),stroke:'rgba(255,255,255,.1)'}));
    s.append(svgEl('text',{x:0,y:Y(v)+3},v));
  }
  series.forEach((se,si)=>{
    const seg=se.avgs.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(seg.length>1)s.append(svgEl('polyline',{points:seg.map(p=>p.join(',')).join(' '),fill:'none',stroke:se.color,'stroke-width':2.5,'stroke-linejoin':'round'}));
    se.avgs.forEach((v,i)=>{
      if(v==null)return;
      s.append(svgEl('circle',{cx:X(i),cy:Y(v),r:4.5,fill:se.color}));
      /* 두 선이 겹치지 않게 첫째는 위, 둘째는 아래에 값 표시 */
      s.append(svgEl('text',{x:X(i),y:Y(v)+(si===0?-9:16),'text-anchor':'middle',class:'v',style:`fill:${se.color}`},v.toFixed(1)));
    });
  });
  SLOTS.forEach(([k,l],i)=>s.append(svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle'},l.replace(' 직후',''))));
  host.append(s);
}
const moodAxis=`<div class="cs" style="margin-bottom:14px">위쪽일수록 개운하고(1), 아래쪽일수록 피곤함(5).</div>`;
function moodAvgs(A){return SLOTS.map(([k])=>avg(A.map(a=>a.r&&a.r.fatigue&&a.r.fatigue[k]).filter(v=>v>0)))}

/* 두 그룹 비교 카드: 하나의 좌표축에 두 선(색 구분) */
function compareCard({title,sub,groups,defaults}){
  const c=el('div','card');
  c.innerHTML=`<div class="ct">${title}</div><div class="cs">${sub}</div>${moodAxis}<div class="sels"></div><div class="chart"></div><div class="legend"></div>`;
  const colors=['#6fb4ff','#b78cff'],sels=[];
  [0,1].forEach(i=>{
    const sw=el('div','sel'),sel=el('select');
    groups.forEach((g,gi)=>sel.append(new Option(g.label,gi)));
    sel.value=defaults[i];sel.style.borderColor=colors[i];
    sw.append(sel);$('.sels',c).append(sw);
    sel.onchange=()=>c._draw();sels.push(sel);
  });
  c._draw=()=>{
    const A=rows(),series=[],lg=$('.legend',c);lg.innerHTML='';
    sels.forEach((sel,i)=>{
      const g=groups[sel.value],sub=A.filter(g.test),withS=sub.filter(a=>a.min!=null);
      series.push({avgs:sub.length?moodAvgs(sub):[null,null,null,null],color:colors[i]});
      lg.append(el('span',null,`<i style="background:${colors[i]}"></i>${g.label} · ${sub.length}회`+(withS.length?` · 평균 ${dur(avg(withS.map(a=>a.min)))}`:'')));
    });
    if(!series.some(s=>s.avgs.some(v=>v!=null)))$('.chart',c).innerHTML='<div class="empty">기록 없음</div>';
    else moodChart($('.chart',c),series);
  };
  return c;
}

const sleepBin=(lo,hi)=>a=>a.min!=null&&a.min>=lo&&a.min<hi;
const stdev=a=>{if(a.length<2)return null;const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
const stat=(l,v)=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`;

/* ───── 섹션 ───── */
const SECTIONS=[
 {id:'summary',render(A0){const A=A0.filter(a=>a.min!=null);
   const n=A.length,bedM=avg(A.map(a=>{let m=a.bed.getHours()*60+a.bed.getMinutes();if(m<12*60)m+=1440;return m}));
   const wakeM=avg(A.map(a=>a.wake.getHours()*60+a.wake.getMinutes()));
   const d=el('div','sgrid');
   d.innerHTML=stat('평균 수면 시간',n?dur(avg(A.map(a=>a.min))):'-')+stat('기록 횟수',n+'회')+stat('평균 취침 시각',bedM==null?'-':fmtMin(bedM))+stat('평균 기상 시각',wakeM==null?'-':fmtMin(wakeM));
   return d}},
 {id:'sleepStat',render(A0){const A=A0.filter(a=>a.min!=null),m=A.map(a=>a.min);
   const sd=stdev(m),short=A.filter(a=>a.min<360).length;
   const d=el('div','sgrid');
   d.innerHTML=stat('최장 수면',m.length?dur(Math.max(...m)):'-')+stat('최단 수면',m.length?dur(Math.min(...m)):'-')
     +stat('수면 규칙성 (표준편차)',sd==null?'-':'±'+Math.round(sd)+'분')+stat('6시간 미만 비율',m.length?Math.round(short/m.length*100)+'% ('+short+'회)':'-');
   return d}},
 {id:'sleepTrend',render(A0){const A=A0.filter(a=>a.min!=null);
   const c=el('div','card');c.innerHTML='<div class="ct">수면 시간 추세</div><div class="cs">점선은 7시간 기준선. 7시간 미만인 날은 주황색.</div><div class="h"></div><div class="legend"><span><i style="background:var(--c1)"></i>7시간 이상</span><span><i style="background:var(--hi)"></i>7시간 미만</span></div>';
   trendChart($('.h',c),A.map(a=>({x:a.wake,y:a.min,hi:a.min<420,label:fmtH(a.min)})),{guide:420,guideLabel:'7h',tickStep:60,fmt:fmtH});
   return c}},
 {id:'sleepDist',render(A0){const A=A0.filter(a=>a.min!=null);
   const bins=[['<5h',0,300],['5h',300,360],['6h',360,420],['7h',420,480],['8h',480,540],['9h+',540,1e9]];
   const c=el('div','card');c.innerHTML='<div class="ct">수면 시간 분포</div><div class="cs">수면 시간 구간별로.</div><div class="h"></div>';
   const h=$('.h',c);
   if(!A.length){h.innerHTML='<div class="empty">기록이 쌓이면 여기에 표시돼요</div>';return c}
   const cnt=bins.map(([l,lo,hi])=>A.filter(a=>a.min>=lo&&a.min<hi).length),mx=Math.max(...cnt,1);
   const H=170,L=10,R=10,T=18,B=24,iw=W-L-R,ih=H-T-B,bw=iw/bins.length;
   const s=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
   s.append(svgEl('line',{x1:L,x2:W-R,y1:T+ih,y2:T+ih,stroke:'rgba(255,255,255,.2)'}));
   bins.forEach(([l],i)=>{
     const bh=ih*cnt[i]/mx,x=L+bw*i+bw*.18;
     s.append(svgEl('rect',{x,y:T+ih-bh,width:bw*.64,height:bh,rx:5,fill:i<3?'#ffb347':'#6fb4ff',opacity:.85}));
     s.append(svgEl('text',{x:x+bw*.32,y:T+ih-bh-5,'text-anchor':'middle',class:'v'},cnt[i]));
     s.append(svgEl('text',{x:x+bw*.32,y:H-7,'text-anchor':'middle'},l));
   });
   h.append(s);return c}},
 {id:'wdwe',render(){const all=rows(true).filter(a=>a.min!=null);
   const wd=all.filter(a=>!isWeekend(a.day)).map(a=>a.min),we=all.filter(a=>isWeekend(a.day)).map(a=>a.min);
   const c=el('div','card');c.innerHTML='<div class="ct">평일 vs 주말 수면</div><div class="cs">기상한 날의 요일 기준.</div><div class="sgrid" style="margin:0"></div>';
   const g=$('.sgrid',c);
   const diff=wd.length&&we.length?Math.round(avg(we)-avg(wd)):null;
   g.innerHTML=stat('평일 평균',wd.length?dur(avg(wd))+` <small style="font-size:11px;color:#9aa3c0">(${wd.length}회)</small>`:'-')
     +stat('주말 평균',we.length?dur(avg(we))+` <small style="font-size:11px;color:#9aa3c0">(${we.length}회)</small>`:'-')
     +`<div class="stat" style="grid-column:1/3"><span>주말 − 평일 차이</span><b>${diff==null?'-':(diff>=0?'+':'−')+dur(Math.abs(diff))}</b></div>`;
   return c}},
 {id:'bed',render(A0){const A=A0.filter(a=>a.min!=null);
   const c=el('div','card');c.innerHTML='<div class="ct">취침 시각 추세</div><div class="cs">자정 이후도 이어서 표시함..</div><div class="h"></div>';
   trendChart($('.h',c),A.map(a=>{let m=a.bed.getHours()*60+a.bed.getMinutes();if(m<12*60)m+=1440;return{x:a.wake,y:m}}),{});
   return c}},
 {id:'wake',render(A0){const A=A0.filter(a=>a.min!=null);
   const c=el('div','card');c.innerHTML='<div class="ct">기상 시각 추세</div><div class="cs">7시 이전에 일어난 날은 주황색.</div><div class="h"></div><div class="legend"><span><i style="background:var(--c1)"></i>7시 이후</span><span><i style="background:var(--hi)"></i>7시 이전</span></div>';
   trendChart($('.h',c),A.map(a=>{const m=a.wake.getHours()*60+a.wake.getMinutes();return{x:a.wake,y:m,hi:m<7*60}}),{guide:7*60,guideLabel:'07:00'});
   return c}},
 {id:'mood',render(A){
   const c=el('div','card');c.innerHTML=`<div class="ct">평균적인 하루의 기분 변화</div><div class="cs">기상 직후부터 저녁까지 평균 피로도.</div>${moodAxis}<div class="h"></div>`;
   if(!A.some(a=>a.r&&a.r.fatigue))$('.h',c).innerHTML='<div class="empty">기록이 쌓이면 여기에 표시돼요</div>';
   else moodChart($('.h',c),[{avgs:moodAvgs(A),color:'#6fb4ff'}]);
   return c}},
 {id:'bySleep',card:()=>compareCard({
   title:'수면 시간에 따른 하루의 기분 변화',
   sub:'시간은 반올림.',
   groups:[
     {label:'전체',test:()=>true},
     {label:'5시간 미만',test:sleepBin(0,300)},
     {label:'5시간 이상',test:sleepBin(300,1e9)},
     {label:'4시간 이하',test:sleepBin(0,270)},
     {label:'5시간',test:sleepBin(270,330)},
     {label:'6시간',test:sleepBin(330,390)},
     {label:'7시간',test:sleepBin(390,450)},
     {label:'8시간',test:sleepBin(450,510)},
     {label:'8시간 초과',test:sleepBin(510,1e9)}],
   defaults:[1,2]})},
 {id:'byLoad',card:()=>compareCard({
   title:'일정에 따른 하루의 기분 변화',
   sub:'하루 정리에서 입력한 일정 강도(1~5)로 묶어서 비교해요.',
   groups:[
     {label:'전체',test:()=>true},
     {label:'1~2 (여유·평범)',test:a=>a.r&&a.r.day&&a.r.day.load<=2},
     {label:'3 (일정 있음)',test:a=>a.r&&a.r.day&&a.r.day.load===3},
     {label:'4~5 (바쁨)',test:a=>a.r&&a.r.day&&a.r.day.load>=4},
     {label:'1 · 여유로운 날',test:a=>a.r&&a.r.day&&a.r.day.load===1},
     {label:'2 · 평범한 날',test:a=>a.r&&a.r.day&&a.r.day.load===2},
     {label:'3 · 일정이 있는 날',test:a=>a.r&&a.r.day&&a.r.day.load===3},
     {label:'4 · 바쁜 날',test:a=>a.r&&a.r.day&&a.r.day.load===4},
     {label:'5 · 아주 긴 하루',test:a=>a.r&&a.r.day&&a.r.day.load===5}],
   defaults:[1,3]})}
];
const cards={};
function render(){
  const A=rows(),host=$('#sections');
  const dt={all:'',weekday:' · 주말 제외',weekend:' · 주말만'}[dayType];
  $('#date').textContent=`${range?`최근 ${range}일`:'전체 기간'}${dt} · 기록 ${A.length}회`;
  if(!host.children.length){
    SECTIONS.forEach(sec=>{
      if(sec.card){const c=sec.card();cards[sec.id]=c;host.append(c)}
      else{const w=el('div');w.dataset.id=sec.id;host.append(w)}
    });
  }
  SECTIONS.forEach(sec=>{
    if(sec.card)cards[sec.id]._draw();
    else{const w=host.querySelector(`[data-id="${sec.id}"]`);w.innerHTML='';w.append(sec.render(A))}
  });
}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{
  range=+b.dataset.r;document.querySelectorAll('#chips button').forEach(x=>x.classList.toggle('on',x===b));render();
});
document.querySelectorAll('#dchips button').forEach(b=>b.onclick=()=>{
  dayType=b.dataset.d;document.querySelectorAll('#dchips button').forEach(x=>x.classList.toggle('on',x===b));render();
});
ALL=collect(LS.get('sleep.cache',[]));render();
load().then(r=>{if(r){ALL=r;render()}});
</script>
</body>
