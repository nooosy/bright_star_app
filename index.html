<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=428, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>밝은 별.</title>
<style>
:root{--bg-top:#161520;--bg-bottom:#3271A6;--line:#7e7e7e;--sub:#7e7e7e;--spring:cubic-bezier(.34,1.56,.64,1);--soft:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000;overscroll-behavior:none}
body{display:flex;justify-content:center;color:#fff;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{user-select:text;-webkit-user-select:text}

/* ── 기본 화면 (iPhone 13 Pro Max 428×926) ── */
.app{position:relative;width:428px;height:926px;max-height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 40%,var(--bg-bottom) 100%)}
.page{position:absolute;inset:0;--x:48px;opacity:0;pointer-events:none;transform:translateX(var(--x)) scale(.985);
  transition:transform .6s var(--soft),opacity .35s ease}
.page.active{opacity:1;pointer-events:auto;transform:none}
.page:not(.active) .aura b{animation-play-state:paused}
h1{position:absolute;left:21px;top:94px;width:386px;display:block;white-space:nowrap;font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.5px}
.scroll{position:absolute;left:0;right:0;top:156px;bottom:116px;padding:16px 21px 48px;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex:none}
.req{min-height:420px}
.divider{height:1px;background:var(--line);margin:0 -14px 0 -4px}
.optlabel{font-size:14px;font-weight:700;color:var(--sub);margin:32px 0 40px 4px}
.next{position:absolute;left:119px;right:22px;bottom:23px;height:76px;border:2px solid #fff;border-radius:38px;font-size:20px;font-weight:700;
  transition:transform .35s var(--spring),background .25s}
.next:active{transform:scale(.95);background:rgba(255,255,255,.12)}
.prev{position:absolute;left:21px;bottom:23px;width:88px;height:76px;border:2px solid rgba(255,255,255,.5);border-radius:38px;font-size:16px;font-weight:700;color:rgba(255,255,255,.8);
  transition:transform .35s var(--spring),background .25s,opacity .25s}
.prev:active{transform:scale(.93);background:rgba(255,255,255,.12)}
.app.fin .next{left:21px}
.app.fin #prev,.app.home #prev{visibility:hidden;pointer-events:none}
.back{position:absolute;left:12px;top:42px;width:44px;height:44px;font-size:34px;line-height:40px;color:rgba(255,255,255,.55);z-index:5;
  transition:opacity .3s,transform .35s var(--spring)}
.back:active{transform:scale(.8)}
.back.hide{opacity:0;pointer-events:none}
.toast{position:absolute;left:28px;right:28px;bottom:118px;padding:13px 16px;border-radius:16px;background:rgba(15,15,25,.92);border:1px solid rgba(255,255,255,.25);
  font-size:13px;font-weight:600;text-align:center;line-height:1.4;z-index:9;opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .3s,transform .5s var(--spring)}
.toast.on{opacity:1;transform:none}

/* ── 질문 블록 ── */
.q{position:relative;margin-bottom:64px}
.q h2{display:block;width:386px;white-space:nowrap;font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.q p{font-size:12px;font-weight:600;line-height:1.7;margin:12px 0 0 4px;color:#e6e6ee}
.q .body{margin-top:32px;position:relative}
.q.nohead .body{margin-top:0}
.clr{position:absolute;right:0;top:6px;font-size:12px;font-weight:700;color:#bcd2ff;padding:4px 8px;opacity:0;pointer-events:none;transition:opacity .3s}
.clr.on{opacity:1;pointer-events:auto}
.clr:active{transform:scale(.9)}
.cap{margin:28px 0 0 34px;font-size:13px;font-weight:600;color:#dfe6ff;min-height:20px;animation:capIn .45s var(--soft)}
@keyframes capIn{from{opacity:0;transform:translateY(5px)}}
.rv{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(-10px);visibility:hidden;
  transition:grid-template-rows .6s var(--soft),opacity .35s ease,transform .6s var(--soft),visibility 0s linear .6s}
.rv.open{grid-template-rows:1fr;opacity:1;transform:none;visibility:visible;transition-delay:0s}
.rv>div{overflow:hidden;min-height:0;margin:-12px -21px;padding:12px 21px}

/* ── 오로라 오브 ── */
.aura{position:absolute;width:52px;height:52px;border-radius:50%;will-change:transform;pointer-events:none;
  --base:#1b2fd0;--a:#2de0e8;--b:#38a0ff;--c:#8a5cff;--amp:3px;--t1:5.8s;--t2:7s;--t3:9s;--t4:6.2s;--t5:8s;--d1:0s;--d2:0s;--d3:0s;--d4:0s;--d5:0s;--dir:normal}
.aura b{position:absolute;will-change:transform,border-radius;animation-direction:var(--dir)}
.aura b:nth-child(1){inset:2px;background:radial-gradient(circle,var(--base) 0,var(--base) 55%,transparent 100%);filter:blur(2.5px);animation:body var(--t1) ease-in-out var(--d1) infinite}
.aura b:nth-child(2){inset:-2px;background:radial-gradient(circle at 30% 30%,var(--a) 0,transparent 55%);filter:blur(4px);mix-blend-mode:screen;animation:fl1 var(--t2) ease-in-out var(--d2) infinite}
.aura b:nth-child(3){inset:-2px;background:radial-gradient(circle at 70% 68%,var(--b) 0,transparent 58%);filter:blur(5px);mix-blend-mode:screen;animation:fl2 var(--t3) ease-in-out var(--d3) infinite}
.aura b:nth-child(4){inset:-1px;background:radial-gradient(circle at 50% 80%,var(--c) 0,transparent 50%);filter:blur(5px);mix-blend-mode:screen;animation:fl3 var(--t4) ease-in-out var(--d4) infinite}
.aura b:nth-child(5){inset:-6px;background:radial-gradient(circle,var(--b) 0,transparent 66%);opacity:.3;filter:blur(6px);animation:halo var(--t5) ease-in-out var(--d5) infinite}
@keyframes body{
 0%{border-radius:50%;transform:rotate(0) scale(1)}
 25%{border-radius:56% 44% 52% 48%/47% 55% 45% 53%;transform:rotate(70deg) scale(1.05,.97)}
 50%{border-radius:45% 55% 42% 58%/56% 44% 56% 44%;transform:rotate(180deg) scale(.97,1.06)}
 75%{border-radius:54% 46% 58% 42%/44% 56% 47% 53%;transform:rotate(270deg) scale(1.06,.98)}
 100%{border-radius:50%;transform:rotate(360deg) scale(1)}}
@keyframes fl1{0%{transform:translate(0,0) rotate(0)}33%{transform:translate(var(--amp),calc(var(--amp)*-.9)) rotate(130deg) scale(1.12)}66%{transform:translate(calc(var(--amp)*-.9),var(--amp)) rotate(250deg) scale(.92)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes fl2{0%{transform:translate(0,0) rotate(360deg)}40%{transform:translate(calc(var(--amp)*-1.1),var(--amp)) rotate(190deg) scale(1.15)}75%{transform:translate(var(--amp),calc(var(--amp)*1.1)) rotate(80deg) scale(.9)}100%{transform:translate(0,0) rotate(0)}}
@keyframes fl3{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(calc(var(--amp)*.8),calc(var(--amp)*-1.2)) scale(1.18) rotate(-160deg)}100%{transform:translate(0,0) rotate(-360deg)}}
@keyframes halo{0%,100%{transform:scale(.94);opacity:.22}50%{transform:scale(1.08);opacity:.4}}
.orb{z-index:1;left:0;top:0}

/* ── 항목 선택 / 슬라이더 ── */
.choice{position:relative;height:52px;margin-left:34px;display:flex;justify-content:space-between}
.choice.track{touch-action:pan-y}
.dot{position:relative;z-index:2;flex:none;width:52px;height:52px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;
  font-size:14px;font-weight:300;white-space:nowrap;transition:transform .4s var(--spring),font-weight .2s}
.dot.sm{font-size:12px}
.dot:active{transform:scale(.88)}
.dot.on{font-weight:600}
.seg{position:absolute;z-index:0;top:50%;height:12px;margin-top:-6px;border-top:1.5px solid #c9c9c9;border-bottom:1.5px solid #c9c9c9;overflow:hidden}
.seg i{position:absolute;inset:0;opacity:0}

/* ── 시각 / 횟수 휠 ── */
.time{display:flex;align-items:center;padding-left:50px;transition:opacity .4s}
.time.dim{opacity:.4}
.ampm{display:flex;flex-direction:column;gap:14px;width:51px;font-size:14px;font-weight:600}
.ampm button{text-align:left;color:#9a9aa6;transition:color .25s,transform .4s var(--spring);transform-origin:left;padding:2px 0}
.ampm button.on{color:#fff;transform:scale(1.12)}
.wheel{position:relative;flex:none;width:98px;height:62px;border:2px solid #fff;border-radius:12px;overflow:hidden;touch-action:none;cursor:grab}
.wheel.fixed{cursor:default}
.wheel div{position:absolute;left:0;right:0;top:0;height:58px;display:grid;place-items:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;will-change:transform}
.colon{width:28px;display:flex;flex-direction:column;align-items:center;gap:12px}
.colon i{width:6px;height:6px;border-radius:50%;background:#fff}
.count{display:flex;align-items:center;justify-content:center;gap:20px;padding-left:20px}
.stepper{display:flex;flex-direction:column;align-items:center;gap:4px}
.chev{width:60px;height:22px;display:grid;place-items:center;transition:transform .35s var(--spring)}
.chev:active{transform:scale(.75)}
.chev svg{width:22px;height:10px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.unit{font-size:19px;font-weight:700}

/* ── 항목 배지 ── */
.badges{overflow-x:scroll;overflow-y:hidden;scrollbar-width:none;width:428px;margin:0 -21px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;padding:6px 0;cursor:grab}
.badges::-webkit-scrollbar{display:none}
.badges.grab{cursor:grabbing}
.bwrap{width:max-content;padding-right:36px}
.brow{display:flex;gap:18px;padding-left:36px}
.brow+.brow{margin-top:24px;padding-left:96px}
.badge{flex:none;width:92px;height:36px;border-radius:18px;font-size:14px;font-weight:600;color:#fff;background:var(--c);
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 0 0 0 #fff;white-space:nowrap;
  transition:transform .45s var(--spring),box-shadow .3s}
.badge:active{transform:scale(.9)}
.badge.on{transform:scale(1.08);box-shadow:0 0 0 2px #161520,0 0 0 4px #fff}
.badge .ck{display:inline-block;width:0;overflow:hidden;white-space:nowrap;transition:width .3s var(--soft)}
.badge.on .ck{width:16px}

/* ── 기분 선택 ── */
.mood{position:relative}
.pill{position:absolute;left:0;top:0;border:5px solid #fff;border-radius:999px;touch-action:none;cursor:grab}
.mglow{left:4px;top:0}
.face{position:absolute;left:5px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:500;transition:transform .45s var(--spring)}
.face.on{transform:scale(1.1)}
.mlab{position:absolute;width:260px;color:#a9a9b0;font-size:14px;font-weight:600;line-height:1.2;transform-origin:left center;transition:transform .5s var(--spring),color .3s;pointer-events:none}
.mlab small{display:block;font-size:12px;font-weight:600;margin:3px 0 0 1px;color:#c5c5cc;transition:color .3s}
.mlab.on{color:#fff;transform:scale(1.2) translateX(2px)}
.mlab.on small{color:#fff}
.mhit{position:absolute;right:0}
.cols{display:flex;gap:10px;position:relative}
.col4{flex:1;min-width:0;text-align:center}
.col4 h2{font-size:19px;font-weight:800;width:auto;line-height:26.4px}
.col4 p{font-size:10.5px;font-weight:700;color:#e6e6ee;line-height:1.5;margin:8px 0 28px 1px;height:64px}
.col4 .mood{width:76px;margin:0 auto}
.col4 .face span{display:inline-block;transform:rotate(90deg)}
.mcap{margin:26px 0 0;width:100%;text-align:center;font-size:14px;font-weight:700;color:#fff;min-height:80px;line-height:1.3;animation:capIn .4s var(--soft)}
.mcap small{display:block;font-size:11px;font-weight:500;color:#dfe6ff;margin-top:6px;line-height:1.45}
.legend{position:absolute;right:0;font-size:12px;font-weight:600;color:#cfcfd8;width:84px}
.legend div{position:absolute;left:0;white-space:nowrap;line-height:18px}

/* ── 텍스트 박스 / 체크박스 ── */
.ta{width:100%;height:96px;border:2px solid #fff;border-radius:16px;background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:14px;font-weight:500;padding:16px 18px;resize:none;outline:0;transition:border-color .25s,background .25s,transform .4s var(--spring)}
.ta:focus{background:rgba(255,255,255,.09);transform:scale(1.01)}
.ta::placeholder{color:#9aa3c0}
.foot{margin-top:auto;padding-top:48px;text-align:center}
.foot p{font-size:14px;font-weight:600;margin-bottom:28px}
.chk{display:inline-flex;align-items:center;gap:12px;font-size:14px;font-weight:600;padding:6px 10px}
.chk .box{width:28px;height:28px;border:2px solid #fff;border-radius:9px;display:grid;place-items:center;transition:transform .45s var(--spring),background .25s}
.chk .box svg{width:16px;height:16px;stroke:#161520;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .35s var(--soft)}
.chk:active .box{transform:scale(.85)}
.chk.on .box{background:#fff}
.chk.on .box svg{stroke-dashoffset:0}

/* ── 완료 ── */
.done{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 30px}
.done h1{position:static;text-align:center;width:auto;margin-bottom:14px}
.done p{font-size:15px;font-weight:600;line-height:1.7;color:#e6eaff}
.done .sum{margin-top:40px;font-size:13px;color:#bcd2ff;font-weight:600;line-height:1.9}
.login{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;padding:0 36px;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 40%,var(--bg-bottom) 100%)}
.login.on{display:flex}
.login p{font-size:14px;color:#cfd6ee;margin-bottom:40px;line-height:1.6}
.login input{user-select:text;-webkit-user-select:text;width:100%;height:56px;border:2px solid #fff;border-radius:16px;background:rgba(255,255,255,.04);
  color:#fff;font:inherit;font-size:16px;padding:0 18px;margin-bottom:16px;outline:0}
.login button{height:64px;margin-top:16px;border:2px solid #fff;border-radius:32px;font-size:18px;font-weight:700}
.login button:active{background:rgba(255,255,255,.12)}
#lg-err{margin-top:20px;font-size:13px;color:#ffb4b4;min-height:20px;line-height:1.5}

/* ── 홈 / 통계 / 하단 탭 ── */
.app.flow .tv,.app.flow .tabs{display:none}
.app.home #pages,.app.home #next,.app.home #back{visibility:hidden;pointer-events:none}
.tv{position:absolute;left:0;right:0;top:0;bottom:84px;padding:94px 21px 150px;overflow-y:auto;overflow-x:hidden;display:none;scrollbar-width:none}
.tv::-webkit-scrollbar{display:none}
.tv.on{display:flex;flex-direction:column}
.tv>*{flex:none}
.tv h1{position:static;width:auto;margin-bottom:8px}
.tv .date{font-size:14px;font-weight:600;color:#cfd6ee;margin:0 0 36px 2px}
.card{border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:20px 20px 18px;margin-bottom:20px;background:rgba(255,255,255,.04)}
.ct{font-size:14px;font-weight:700;color:#cfd6ee;margin-bottom:16px}
.ct small{font-size:12px;font-weight:600;color:var(--sub);margin-left:6px}
.bnum{font-size:34px;font-weight:800;letter-spacing:-.5px}
.card .sub{font-size:13px;font-weight:600;color:#bcd2ff;margin-top:10px;line-height:1.7}
.big{position:absolute;left:21px;right:21px;bottom:90px;height:88px;z-index:5;border:2px solid #fff;border-radius:50px;background:rgba(14,18,32,.82);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .3s var(--spring),background .2s}
.app.flow .big{display:none}
#h-ct small{color:#bcd2ff}
.lw{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:600;color:#cfd6ee}
.lw b{color:#fff;font-weight:800;margin-left:4px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.cal-h b{font-size:16px;font-weight:800}
.cal-h button{width:40px;height:40px;border-radius:20px;font-size:24px;line-height:36px;color:#cfd6ee}
.cal-h button:active{background:rgba(255,255,255,.12)}
.cal-h button:disabled{opacity:.25;pointer-events:none}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.cal-w{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding-bottom:6px}
.cd{position:relative;height:46px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.cd .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;transition:border-color .2s,transform .25s var(--spring)}
.cd.has .c{background:rgba(86,160,255,var(--a))}
.cd.sumonly .c{border:1.5px solid rgba(110,170,255,.75)}
.cal-l u.r{border-style:solid;border-color:rgba(110,170,255,.75)}
.cd.miss .c{border:1.5px dashed rgba(255,255,255,.35)}
.cd.sel .c{border:2px solid #fff;transform:scale(1.08)}
.cd.today::after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:#fff}
.cd.fut{color:#4b5266;pointer-events:none}
.cd:active .c{transform:scale(.92)}
.cal-l{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:11px;font-weight:600;color:var(--sub)}
.cal-l i{width:70px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(86,160,255,.2),rgba(86,160,255,1))}
.cal-l em{margin-left:auto;font-style:normal;display:flex;align-items:center;gap:6px}
.cal-l u{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.4)}
#cal-detail{scroll-margin-bottom:130px}
.drow{display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.drow span{width:84px;flex:none;color:var(--sub);font-weight:600}
.drow b{flex:1;font-weight:600;color:#e6eaff;line-height:1.5;word-break:keep-all}
.big:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.big b{font-size:26px;font-weight:800;letter-spacing:-.3px}
.big small{font-size:13px;font-weight:600;color:#cfd6ee}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;z-index:6;border-top:1px solid rgba(255,255,255,.18);
  background:rgba(15,15,25,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding-bottom:12px;color:var(--sub);font-size:12px;font-weight:700;
  transition:color .25s}
.tab.on{color:#fff}
.tab:active svg{transform:scale(.88)}
.tab svg{transition:transform .25s var(--spring)}
.chips{display:flex;gap:10px;margin:0 0 24px}
.chips button{height:38px;padding:0 20px;border:1.5px solid var(--line);border-radius:19px;font-size:14px;font-weight:700;color:var(--sub);transition:all .25s}
.chips button.on{border-color:#fff;color:#fff}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.stat{border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:18px;background:rgba(255,255,255,.04)}
.stat span{font-size:12px;font-weight:600;color:#cfd6ee}
.stat b{display:block;font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.3px}
.bars{position:relative;height:190px;display:flex;gap:6px}
.bar{flex:1;height:100%;position:relative;min-width:0}
.bar i{position:absolute;bottom:22px;left:12%;right:12%;height:calc((100% - 46px)*var(--r));min-height:2px;border-radius:5px 5px 2px 2px;background:#6fb4ff}
.bar .bv{position:absolute;left:-4px;right:-4px;text-align:center;bottom:calc(22px + (100% - 46px)*var(--r) + 4px);font-size:11px;font-weight:700;color:#e6eaff}
.bar .bl{position:absolute;left:-6px;right:-6px;bottom:0;text-align:center;font-size:10px;font-weight:600;color:var(--sub);white-space:nowrap}
.guide{position:absolute;left:0;right:0;bottom:calc(22px + (100% - 46px)*var(--g));border-top:1px dashed rgba(255,255,255,.3);pointer-events:none}

<script>
const buzz=(n=8)=>navigator.vibrate&&navigator.vibrate(n);
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const mod=(a,n)=>((a%n)+n)%n;
const pad2=n=>String(n).padStart(2,'0');
const LAST=(()=>{try{return JSON.parse(localStorage.getItem('sleep.last'))||{}}catch(e){return {}}})();
const lastIdx=(k,max,d)=>Number.isInteger(LAST[k])&&LAST[k]>=0&&LAST[k]<max?LAST[k]:d;

/* ── 스프링 엔진 ── */
function Spring(x0,onUpdate,{k=200,c=17}={}){
  let x=x0,v=0,t=x0,raf=0,last=0;
  function tick(now){
    const dt=Math.min(.032,(now-last)/1000||.016);last=now;
    for(let i=0;i<3;i++){const a=-k*(x-t)-c*v;v+=a*dt/3;x+=v*dt/3}
    if(Math.abs(x-t)<.04&&Math.abs(v)<.4){x=t;v=0;onUpdate(x);raf=0;return}
    onUpdate(x);raf=requestAnimationFrame(tick);
  }
  const start=()=>{if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}};
  return{get x(){return x},get target(){return t},
    to(nt,p){t=nt;if(p){k=p.k??k;c=p.c??c}start()},
    set(nx){x=nx;t=nx;v=0;onUpdate(x)},
    kick(vel){v=vel;start()}};
}

/* ── 오로라 오브: 인스턴스마다 속도·방향·진폭·위상이 다름 ── */
function makeAura(cls){
  const e=el('div','aura '+(cls||''),'<b></b><b></b><b></b><b></b><b></b>');
  const r=(a,b)=>a+Math.random()*(b-a);
  e.style.setProperty('--amp',r(2.5,4.5).toFixed(1)+'px');
  [5.2,6.5,8,5.6,7.4].forEach((t,i)=>{
    e.style.setProperty('--t'+(i+1),(t*r(.7,1.4)).toFixed(2)+'s');
    e.style.setProperty('--d'+(i+1),(-r(0,10)).toFixed(2)+'s');
  });
  e.style.setProperty('--dir',Math.random()<.5?'normal':'reverse');
  return e;
}

/* ===== 항목 선택(클릭) / 슬라이더(드래그) ===== */
function Choice(root,{labels,track=false,index=0,captions=null,onChange}){
  const n=labels.length,box=el('div','choice'+(track?' track':''));
  box.style.width=(n===2?196:308)+'px';root.append(box);
  const dots=[],segs=[];let cur=index;
  const orb=makeAura('orb');box.append(orb);
  labels.forEach((t,i)=>{
    if(track&&i>0){const s=el('div','seg','<i></i>');box.append(s);segs.push(s)}
    const d=el('button','dot'+(t.length>2?' sm':''),t);d.type='button';box.append(d);dots.push(d);
  });
  let cap=null;if(captions){cap=el('div','cap');root.append(cap)}
  const setCap=()=>{if(!cap)return;cap.textContent=captions[cur];cap.style.animation='none';void cap.offsetWidth;cap.style.animation=''};
  const cx=i=>dots[i].offsetLeft+26;
  let ox=0,sqx=1,sqy=1;
  const apply=()=>{orb.style.transform=`translateX(${ox-26}px) scale(${sqx},${sqy})`};
  const sqSp=Spring(1,v=>{sqy=v;sqx=1+(1-clamp(v,.2,1.3))*.55;apply()},{k:150,c:9});
  function render(x){
    ox=x;
    if(track){
      let d=1e9;dots.forEach((_,k)=>d=Math.min(d,Math.abs(cx(k)-x)));
      const tgt=1-(1-13/52)*smooth(20,34,d);
      if(Math.abs(tgt-sqSp.target)>.002)sqSp.to(tgt);
      segs.forEach((g,k)=>{
        const a=cx(k)+26,b=cx(k+1)-26;
        g.style.left=a-2+'px';g.style.width=(b-a+4)+'px';
        const gl=$('i',g),dist=x<a?a-x:x>b?x-b:0,o=1-smooth(0,34,dist);
        gl.style.opacity=o;
        gl.style.background=`radial-gradient(circle 34px at ${x-a+2}px 50%,rgba(90,170,255,.95) 0,rgba(60,130,255,.45) 55%,rgba(60,130,255,0) 100%)`;
      });
    }
    apply();
  }
  const sp=Spring(0,render,{k:230,c:18});
  const paint=()=>dots.forEach((d,k)=>d.classList.toggle('on',k===cur));
  function select(i,vib=true){if(i===cur)return;cur=i;paint();setCap();vib&&buzz();onChange&&onChange(i)}
  const init=()=>{sp.set(cx(cur));paint();setCap()};
  if(!track){
    dots.forEach((d,i)=>d.addEventListener('click',()=>{select(i);sp.to(cx(i),{k:230,c:18})}));
  }else{
    let drag=false;
    const px=e=>e.clientX-box.getBoundingClientRect().left;
    const nearest=x=>{let b=0,bd=1e9;dots.forEach((_,k)=>{const dd=Math.abs(cx(k)-x);if(dd<bd){bd=dd;b=k}});return b};
    box.addEventListener('pointerdown',e=>{drag=true;box.setPointerCapture(e.pointerId);
      const x=clamp(px(e),cx(0),cx(n-1));select(nearest(x));sp.to(x,{k:420,c:36})});
    box.addEventListener('pointermove',e=>{if(!drag)return;
      const x=clamp(px(e),cx(0),cx(n-1));select(nearest(x));sp.to(x,{k:420,c:36})});
    const up=()=>{if(!drag)return;drag=false;sp.to(cx(cur),{k:230,c:17})};
    box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  }
  requestAnimationFrame(init);
  return{get value(){return cur},select:i=>{select(i,false);sp.to(cx(i),{k:230,c:18})}};
}

/* ===== 휠: 시각(루프) / 횟수(범위) ===== */
function Wheel(root,{items,index=0,loop=false,fixed=false,onChange}){
  const H=58,N=items.length,nodes=items.map(t=>{const d=el('div','',t);root.append(d);return d});
  root.classList.toggle('fixed',fixed);
  let pos=index*H,lastIdx=-1;const maxP=(N-1)*H;
  const idxOf=p=>loop?mod(Math.round(p/H),N):clamp(Math.round(p/H),0,N-1);
  function render(p){
    pos=p;const half=N*H/2;
    nodes.forEach((d,i)=>{
      let y=i*H-p;if(loop)y=mod(y+half,N*H)-half;
      if(Math.abs(y)>H*1.3){d.style.display='none'}else{d.style.display='';d.style.transform=`translateY(${y}px)`}
    });
    const k=idxOf(p);if(k!==lastIdx){if(lastIdx>=0){buzz(5);onChange&&onChange(k,items[k])}lastIdx=k}
  }
  const sp=Spring(pos,render,{k:170,c:19});sp.set(pos);
  if(!fixed){
    let drag=false,sy=0,sp0=0,ly=0,lt=0,v=0;
    const rub=p=>loop?p:(p<0?p*.35:p>maxP?maxP+(p-maxP)*.35:p);
    root.addEventListener('pointerdown',e=>{drag=true;root.setPointerCapture(e.pointerId);sy=ly=e.clientY;sp0=sp.x;lt=performance.now();v=0;sp.set(sp.x)});
    root.addEventListener('pointermove',e=>{if(!drag)return;
      const now=performance.now();v=.6*v+.4*((ly-e.clientY)/Math.max(1,now-lt));ly=e.clientY;lt=now;
      sp.set(rub(sp0+(sy-e.clientY)))});
    const up=()=>{if(!drag)return;drag=false;
      v=clamp(v,-3,3);let t=Math.round((sp.x+v*150)/H);if(!loop)t=clamp(t,0,N-1);
      sp.to(t*H,{k:170,c:19});sp.kick(v*1000)};
    root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  }
  return{step(d){const t=Math.round(sp.x/H)+d;sp.to((loop?t:clamp(t,0,N-1))*H,{k:260,c:16});buzz(7)},
    goNearest(i){const c=Math.round(sp.x/H);const diff=loop?mod(i-c+N/2,N)-N/2:i-c;sp.to((c+diff)*H,{k:200,c:17})},
    get index(){return idxOf(sp.x)}};
}

/* ===== 시각 선택: AM/PM + 시:분 (분 '--' 고정 가능, 선택 질문은 흐리게 시작) ===== */
function TimePicker(root,{ap='AM',hour=7,minute=0,minuteFixed=false,optional=false,onTouch}={}){
  root.classList.add('time');if(optional)root.classList.add('dim');
  let cur=ap,touched=!optional;
  const box=el('div','ampm'),am=el('button','','AM'),pm=el('button','','PM');am.type=pm.type='button';box.append(am,pm);
  const pick=(p,vib=true)=>{cur=p;am.classList.toggle('on',p==='AM');pm.classList.toggle('on',p==='PM');vib&&buzz(6)};
  am.onclick=()=>pick('AM');pm.onclick=()=>pick('PM');pick(ap,false);
  const touch=()=>{if(touched)return;touched=true;root.classList.remove('dim');onTouch&&onTouch(true)};
  root.addEventListener('pointerdown',touch,true);
  const hw=el('div','wheel'),mw=el('div','wheel'),colon=el('div','colon','<i></i><i></i>');
  root.append(box,hw,colon,mw);
  const h=Wheel(hw,{items:Array.from({length:12},(_,i)=>String(i+1)),loop:true,index:hour-1});
  const m=minuteFixed?Wheel(mw,{items:['--'],fixed:true}):Wheel(mw,{items:Array.from({length:60},(_,i)=>pad2(i)),loop:true,index:minute});
  return{get touched(){return touched},
    get value(){return{ap:cur,hour:h.index+1,minute:minuteFixed?null:m.index}},
    reset(){touched=false;root.classList.add('dim');pick(ap,false);h.goNearest(hour-1);if(!minuteFixed)m.goNearest(minute);onTouch&&onTouch(false)}};
}
const to24=t=>{let h=t.hour%12;if(t.ap==='PM')h+=12;return h};
const fmtT=t=>t?`${pad2(to24(t))}:${t.minute==null?'--':pad2(t.minute)}`:null;

/* ===== 횟수 ===== */
function Count(root,{items,index=0,unit}){
  root.classList.add('count');
  const up=el('button','chev','<svg viewBox="0 0 22 10"><path d="M2 8l9-6 9 6"/></svg>');
  const dn=el('button','chev','<svg viewBox="0 0 22 10"><path d="M2 2l9 6 9-6"/></svg>');
  const w=el('div','wheel'),st=el('div','stepper');st.append(up,w,dn);root.append(st,el('span','unit',unit));
  const wh=Wheel(w,{items,index});up.onclick=()=>wh.step(1);dn.onclick=()=>wh.step(-1);
  return{get value(){return +items[wh.index]}};
}

/* ===== 항목 배지 (다중선택, 가로 스크롤) ===== */
const BCOL=['#ee8f33','#33bfea','#a23ae8','#d94a6a','#3568ee','#33ee88','#8a8f99'];
function Badges(root,{items,rows=2,def=[],rule,onChange}){
  const bx=el('div','badges'),wrap=el('div','bwrap');
  const rws=Array.from({length:rows},()=>el('div','brow'));
  let sel=new Set(def);const bs=[];
  const apply=nx=>{sel=nx;bs.forEach((b,i)=>b.classList.toggle('on',sel.has(i)));onChange&&onChange([...sel])};
  items.forEach((t,i)=>{
    const b=el('button','badge','<span class="ck">✓</span><span>'+t+'</span>');b.type='button';b.style.setProperty('--c',BCOL[i%BCOL.length]);
    b.onclick=()=>{let nx=new Set(sel);nx.has(i)?nx.delete(i):nx.add(i);if(rule)nx=rule(nx,i,sel);apply(nx);buzz(8)};
    bs.push(b);rws[rows===1?0:i%rows].append(b);
  });
  rws.forEach(r=>wrap.append(r));bx.append(wrap);root.append(bx);apply(sel);
  let down=false,sx=0,sl=0,moved=false,lx=0,lt=0,vel=0,raf=0;
  bx.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;down=true;moved=false;sx=lx=e.clientX;sl=bx.scrollLeft;lt=performance.now();vel=0;cancelAnimationFrame(raf)});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;
    if(Math.abs(dx)>5){moved=true;bx.classList.add('grab')}
    if(moved){bx.scrollLeft=sl-dx;const n=performance.now();vel=(lx-e.clientX)/Math.max(1,n-lt);lx=e.clientX;lt=n}});
  window.addEventListener('pointerup',()=>{if(!down)return;down=false;bx.classList.remove('grab');
    if(moved){let v=vel*16;const f=()=>{bx.scrollLeft+=v;v*=.93;if(Math.abs(v)>.3)raf=requestAnimationFrame(f)};f()}});
  bx.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  return{get value(){return [...sel]},get labels(){return [...sel].map(i=>items[i])},has:i=>sel.has(i)};
}

/* ===== 기분 선택 (세로 드래그, 위=파랑 → 아래=빨강) ===== */
const MOOD=[
 ['개운함','정신 맑고 또렷, 집중 매우 잘 됨'],
 ['좋음','경미한 피로감, 무시 가능'],
 ['보통','피로하지만 일상생활 가능'],
 ['피곤함','피로하며 휴식 필요, 꿈꾸는 듯 멍함'],
 ['매우 피곤함','즉각적 휴식 필요, 집중 전혀 안 됨']];
const FACES=[':D',':)',':|',':(',';<'];
const MCOL=[[52,112,240],[46,222,120],[238,214,24],[244,148,44],[228,56,66]];
function Mood(root,{step=95,face=56,labels=true,upright=false,def=2,onChange}){
  const TOP=14,gs=face+2,pillW=face+20,pillH=4*step+face+38,Y0=TOP-1,Y1=Y0+4*step;
  root.classList.add('mood');root.style.height=pillH+'px';
  const pill=el('div','pill');pill.style.width=pillW+'px';pill.style.height=pillH+'px';root.append(pill);
  const glow=makeAura('mglow');glow.style.width=glow.style.height=gs+'px';pill.append(glow);
  const fe=[],le=[];
  FACES.forEach((f,i)=>{
    const d=el('div','face',upright?`<span>${f}</span>`:f);d.style.cssText=`top:${TOP+i*step}px;width:${face}px;height:${face}px;font-size:${Math.round(face*.36)}px`;pill.append(d);fe.push(d);
    if(labels){
      const l=el('div','mlab',`<span>${MOOD[i][0]}</span><small>${MOOD[i][1]}</small>`);
      l.style.top=(5+TOP+i*step+face/2-19)+'px';l.style.left=(pillW+26)+'px';root.append(l);le.push(l);
      const hit=el('div','mhit');hit.style.cssText=`top:${5+TOP+i*step+face/2-step/2}px;height:${step}px;left:${pillW+8}px`;
      hit.onclick=()=>{select(i);sp.to(Y0+i*step,{k:230,c:15})};root.append(hit);
    }
  });
  let cur=def;
  const mix=(p,q,t)=>p.map((v,k)=>Math.round(v+(q[k]-v)*t));
  const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
  function render(y){
    const f=clamp((y-Y0)/step,0,4),i=Math.floor(f),j=Math.min(4,i+1),t=f-i;
    const col=mix(MCOL[i],MCOL[j],t),ni=clamp(Math.round(f)+(t<.5?1:-1),0,4);
    glow.style.setProperty('--base',css(mix(col,[0,0,0],.15)));
    glow.style.setProperty('--a',css(mix(col,[255,255,255],.45)));
    glow.style.setProperty('--b',css(col));
    glow.style.setProperty('--c',css(mix(col,MCOL[ni],.6)));
    glow.style.transform=`translateY(${y}px)`;
  }
  const sp=Spring(0,render,{k:230,c:17});
  function paint(){fe.forEach((d,k)=>d.classList.toggle('on',k===cur));
    le.forEach((l,k)=>l.classList.toggle('on',k===cur))}
  function select(i,vib=true){if(i===cur)return;cur=i;paint();vib&&buzz(6);onChange&&onChange(i)}
  const yOf=e=>clamp(e.clientY-pill.getBoundingClientRect().top-5-gs/2+1,Y0,Y1);
  const near=y=>Math.round((y-Y0)/step);
  let drag=false;
  pill.addEventListener('pointerdown',e=>{drag=true;pill.setPointerCapture(e.pointerId);const y=yOf(e);select(near(y));sp.to(y,{k:420,c:36})});
  pill.addEventListener('pointermove',e=>{if(!drag)return;const y=yOf(e);select(near(y));sp.to(y,{k:420,c:36})});
  const up=()=>{if(!drag)return;drag=false;sp.to(Y0+cur*step,{k:230,c:15})};
  pill.addEventListener('pointerup',up);pill.addEventListener('pointercancel',up);
  paint();sp.set(Y0+def*step);onChange&&onChange(def);
  return{get value(){return cur},get h(){return pillH},step};
}

  const w=el('div','rv'+(open?' open':'')),inner=el('div');inner.append(...(Array.isArray(content)?content:[content]));w.append(inner);

/* ===== 페이지 조립 도구 ===== */
const P={};            // 컴포넌트 보관
const pages={};        // 1~8번 페이지
function mkQ(title,desc,{nohead=false}={}){

function optTime(title,desc,def){

function mkPage(title,{req=[],opt=[],footer=null,optHidden=false}={}){
  const pg=el('section','page');pg.append(el('h1','fit',title));
  const sc=el('div','scroll'),rq=el('div','req');req.forEach(n=>rq.append(n));sc.append(rq);

function bedISO(t){ // AM 취침은 오늘 새벽, PM 취침은 어제 밤

function wakeAfter(bedIso,t){
  const b=new Date(bedIso),w=new Date(b);w.setHours(to24(t),t.minute??0,0,0);
  if(w<=b)w.setDate(w.getDate()+1);return w;
}

const sbReady=()=>!SUPABASE_URL.includes('YOUR-PROJECT')&&!SUPABASE_KEY.startsWith('YOUR_');
const loginEl=$('#login');
function setAuth(j){LS.set('sleep.auth',{access_token:j.access_token,refresh_token:j.refresh_token,
  expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600)})}
async function authCall(grant,body){
  const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`,{method:'POST',
    headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.msg||j.error_description||j.error||('HTTP '+r.status));
  return j;
}
async function getToken(){
  const a=LS.get('sleep.auth',null);if(!a)return null;
  if(a.expires_at-60>Date.now()/1000)return a.access_token;
  try{const j=await authCall('refresh_token',{refresh_token:a.refresh_token});setAuth(j);return j.access_token}
  catch(e){if(navigator.onLine!==false&&!/Failed to fetch|NetworkError/i.test(e.message))LS.del('sleep.auth');return null}
}
const needLogin=()=>sbReady()&&!LS.get('sleep.auth',null);
function showLogin(){loginEl.classList.add('on')}
loginEl.addEventListener('submit',async ev=>{
  ev.preventDefault();const err=$('#lg-err'),btn=$('#lg-btn');err.textContent='';btn.disabled=true;
  try{
    const j=await authCall('password',{email:$('#lg-email').value.trim(),password:$('#lg-pw').value});
    setAuth(j);$('#lg-pw').value='';loginEl.classList.remove('on');flushOutbox().then(()=>refreshAll());
  }catch(e){err.textContent='로그인에 실패했어요. 이메일과 비밀번호를 확인해 주세요.'}
  btn.disabled=false;
});
function toRow(r){return{saved_at:r.saved,bed_time:r.bedTime,latency:r.latency,place:r.place,awakenings:r.awakenings,
  natural_wake:r.naturalWake,final_wake:r.finalWake,data:r}}
let flushing=false;
async function flushOutbox(){
  if(!sbReady()||flushing)return true;
  const box=LS.get('sleep.outbox',[]);if(!box.length)return true;
  flushing=true;
  try{
    const tok=await getToken();if(!tok){if(needLogin())showLogin();return false}
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?on_conflict=saved_at`,{method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',
        Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(box.map(toRow))});
    if(res.status===401||res.status===403){LS.del('sleep.auth');showLogin();return false}
    if(!res.ok)throw new Error(res.status+' '+await res.text());
    LS.del('sleep.outbox');return true;
  }catch(e){console.warn('Supabase 저장 실패',e);return false}
  finally{flushing=false}
}

  return `수면 시간 약 ${Math.floor(mins/60)}시간 ${mins%60}분`;
}

function collect(remote){
  const m=new Map();[...remote,...LS.get('sleep.records',[])].forEach(r=>{if(r&&r.saved)m.set(r.saved,r)});
  return [...m.values()];
}
async function loadRemote(){

      }

  }

function analyze(r){
  const w=r.finalWake||r.naturalWake;if(!w||!r.bedTime)return null;
  const bed=new Date(r.bedTime),[h,mi]=w.split(':').map(Number);if(isNaN(h))return null;
  const wk=new Date(bed);wk.setHours(h,isNaN(mi)?0:mi,0,0);if(wk<=bed)wk.setDate(wk.getDate()+1);
  const min=Math.round((wk-bed)/60000);if(min<=0||min>=24*60)return null;
  return{bed,wake:wk,min,r};
}
/* 하루 단위 정리: 하루는 05시에 시작(새벽 입력은 전날로 계산). 수면=기상 시각이 있는 기록, 하루 정리=그날 입력한 기록 */
function logicalDay(r){

  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function buildDays(list){
  const days=new Map(),now=new Date();
  const get=k=>{if(!days.has(k)){const [Y,M,D]=k.split('-').map(Number);days.set(k,{day:new Date(Y,M-1,D),sleep:null,sum:null})}return days.get(k)};
  list.filter(r=>r&&r.saved&&r.fatigue).forEach(r=>{const e=get(logicalDay(r));if(!e.sum||String(r.saved)>String(e.sum.saved))e.sum=r});
  dedupeSleep(list).map(analyze).filter(a=>a&&a.wake<=now).forEach(a=>{
    const k=a.wake.getFullYear()+'-'+pad2(a.wake.getMonth()+1)+'-'+pad2(a.wake.getDate()),e=get(k);
    if(!e.sleep||String(a.r.saved)>String(e.sleep.r.saved))e.sleep=a});
  return days;
}
/* 같은 수면이 두 번 잡히지 않게 정리: (1) '지금 바로 취침'으로 만든 계획 기록은 뒤이은 기상 기록이 있으면 제외, (2) 같은 기상일은 마지막 기록만 */
function dedupeSleep(list){
  const T=x=>+new Date(x);
  const out=list.filter(r=>{
    if(!r||!r.saved)return false;
    const sv=T(r.saved);
    return !list.some(o=>o!==r&&o.bedTime&&T(o.bedTime)>=sv-1000&&T(o.bedTime)<=sv+10000&&o.awakenings!=null&&r.awakenings==null);
  });
  return out;
}
const analyzed=()=>{
  const NOW=new Date();
  const A=dedupeSleep(RECS).map(analyze).filter(a=>a&&a.wake<=NOW).sort((a,b)=>a.wake-b.wake);
  const m=new Map();A.forEach(x=>{const k=x.wake.getFullYear()+'-'+x.wake.getMonth()+'-'+x.wake.getDate();const o=m.get(k);if(!o||String(x.r.saved)>String(o.r.saved))m.set(k,x)});
  return [...m.values()].sort((a,b)=>a.wake-b.wake);
};
function inRange(A,n){const lim=new Date();lim.setHours(0,0,0,0);lim.setDate(lim.getDate()-(n-1));return A.filter(a=>a.wake>=lim)}
function barChart(host,arr,{show=true,every=1}={}){
  host.innerHTML='';
  if(!arr.length){host.innerHTML='<div class="empty">기록이 쌓이면 여기에 표시돼요</div>';return}
  const max=Math.max(10*60,...arr.map(a=>a.min));
  const wrap=el('div','bars');wrap.style.setProperty('--g',(8*60/max).toFixed(3));
  wrap.append(el('div','guide','<span>8시간</span>'));
  arr.forEach((a,i)=>{
    const c=el('div','bar');c.style.setProperty('--r',(a.min/max).toFixed(3));
    c.innerHTML=`<span class="bv">${show?(a.min/60).toFixed(1):''}</span><i></i><span class="bl">${i%every===0?(a.wake.getMonth()+1)+'/'+a.wake.getDate():''}</span>`;
    wrap.append(c);
  });
  host.append(wrap);
}
const key=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const day0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selDate=null,calMonth=day0(new Date()),byDay=new Map(),sumDay=new Map(),bigTarget=null;calMonth.setDate(1);
function renderHome(){
  const now=new Date(),A=analyzed(),last=A[A.length-1],card=$('#h-card');
  byDay=new Map();A.forEach(a=>byDay.set(key(a.wake),a));
  sumDay=new Map();buildDays(RECS).forEach((e,k)=>{if(e.sum)sumDay.set(k,e.sum)});
  $('#h-date').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${DOW[now.getDay()]}요일`;
  const lw=day0(now);lw.setDate(lw.getDate()-7);const lr=byDay.get(key(lw));
  const lwHtml=`<div class="lw">지난주 ${DOW[lw.getDay()]}요일(${lw.getMonth()+1}/${lw.getDate()}) 취침<b>${lr?clk(lr.bed):'기록 없음'}</b></div>`;
  if(pending){
    card.innerHTML=`<div class="ct">현재 상태</div><div class="bnum">취침 중</div><div class="sub">${clk(new Date(pending.bed))}에 취침을 기록했어요.<br>일어나면 아래 버튼으로 이어서 기록해 주세요.</div>${lwHtml}`;
  }else if(last){
    card.innerHTML=`<div class="ct">최근 수면 · ${last.wake.getMonth()+1}/${last.wake.getDate()}</div><div class="bnum">${dur(last.min)}</div><div class="sub">${clk(last.bed)} 취침 · ${clk(last.wake)} 기상</div>${lwHtml}`;
  }else{
    card.innerHTML=`<div class="ct">최근 수면</div><div class="bnum">기록 없음</div><div class="sub">아래 버튼으로 첫 기록을 시작해 보세요.</div>${lwHtml}`;
  }
  const A3=inRange(A,3),s3=A3.reduce((t,a)=>t+a.min,0);
  $('#h-ct').innerHTML=`최근 7일 수면 시간<small>${A3.length?`최근 3일 합 ${dur(s3)}${A3.length<3?` (${A3.length}일 기록)`:''}`:'최근 3일 기록 없음'}</small>`;
  barChart($('#h-chart'),inRange(A,7),{show:true,every:1});
  renderCal();renderDetail();updateBig();
}
function renderCal(){
  const host=$('#cal'),y=calMonth.getFullYear(),m=calMonth.getMonth(),today=day0(new Date(Date.now()-5*3600e3));
  const ws=[...byDay.values()].map(a=>+day0(a.wake)).concat([...sumDay.keys()].map(k=>{const [Y,M,D]=k.split('-').map(Number);return +new Date(Y,M-1,D)})),first=ws.length?Math.min(...ws):null;
  const startDow=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let h=`<div class="ct">수면 달력</div><div class="cal-h"><button type="button" id="cal-p" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button type="button" id="cal-n" aria-label="다음 달">›</button></div><div class="cal-g">`;
  [...DOW].forEach(w=>h+=`<div class="cal-w">${w}</div>`);
  for(let i=0;i<startDow;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d),k=key(dt),a=byDay.get(k),fut=dt>today,isT=+dt===+today;
    let cls='cd',st='';
    if(a){const al=.2+.8*clamp((a.min-240)/300,0,1);st=`--a:${al.toFixed(2)};${al>.62?'color:#0b1020':''}`;cls+=' has'}
    else if(sumDay.has(k))cls+=' sumonly';
    else if(!fut&&!isT&&first!=null&&+dt>first)cls+=' miss';
    if(fut)cls+=' fut';if(isT)cls+=' today';if(selDate&&k===key(selDate))cls+=' sel';
    h+=`<button type="button" class="${cls}" data-k="${k}"${fut?' disabled':''}><span class="c" style="${st}">${d}</span></button>`;
  }
  h+=`</div><div class="cal-l"><span>4시간</span><i></i><span>9시간</span><em><u class="r"></u>하루 정리만<u></u>빠트린 날</em></div>`;
  host.innerHTML=h;
  const cm=day0(new Date());cm.setDate(1);
  $('#cal-n').disabled=calMonth>=cm;
  $('#cal-p').onclick=()=>{calMonth=new Date(y,m-1,1);buzz(6);renderCal()};
  $('#cal-n').onclick=()=>{calMonth=new Date(y,m+1,1);buzz(6);renderCal()};
  host.querySelectorAll('.cd').forEach(b=>b.onclick=()=>{
    const [Y,M,D]=b.dataset.k.split('-').map(Number);
    selDate=(selDate&&key(selDate)===b.dataset.k)?null:new Date(Y,M-1,D);
    buzz(8);renderCal();renderDetail();updateBig();
    if(selDate)$('#cal-detail').scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
const MOODN=v=>v>=1&&v<=5?MOOD[v-1][0]:'-';
function renderDetail(){
  const box=$('#cal-detail');
  if(!selDate){box.style.display='none';return}
  box.style.display='';
  const k=key(selDate),a=byDay.get(k),r=sumDay.get(k)||(a&&a.r),today=day0(new Date(Date.now()-5*3600e3));
  const title=`${selDate.getMonth()+1}월 ${selDate.getDate()}일 (${DOW[selDate.getDay()]})`;
  if(!a&&!r){
    const msg=selDate>today?'아직 오지 않은 날이에요.':(+selDate===+today?(pending?'취침은 기록됐어요. 기상 기록을 기다리고 있어요.':'아직 기록이 없어요.'):'이 날은 기록이 없어요.<br>아래 버튼으로 이 날의 기록을 남길 수 있어요.');
    box.innerHTML=`<div class="ct">${title}</div><div class="sub" style="margin-top:0">${msg}</div>`;return;
  }
  const f=r.fatigue||{},dr=r.drowsy||{},cf=r.caffeine,ex=r.exercise||{},dy=r.day||{},sr=a?a.r:{};
  const exs=[ex.personal?`개인 운동 ${ex.minutes||0}분`:null,ex.pe?'체육 수업':null].filter(Boolean);
  const rows=[
    a?['취침 · 기상',`${clk(a.bed)} → ${clk(a.wake)}`]:null,
    a&&sr.latency?['잠드는 데',sr.latency]:null,
    a&&(sr.place||r.place)?['취침 장소',sr.place||r.place]:null,
    a&&sr.awakenings!=null?['중간에 깬 횟수',sr.awakenings+'회']:null,
    a&&sr.naturalWake?['눈이 떠진 시각',sr.naturalWake]:null,
    ['하루 기분',`기상 직후 ${MOODN(f.wake)}<br>아침 ${MOODN(f.morning)}<br>오후 ${MOODN(f.afternoon)}<br>저녁 ${MOODN(f.evening)}`],
    ['식곤증',dr.level>0?`${['없음','경미','중등','중증'][dr.level]}${dr.time?' ('+dr.time+')':''}`:'없음'],
    ['카페인',cf?`${esc((cf.kinds||[]).join(', ')||'-')} · ${cf.cups}잔${cf.start?` (${cf.start}~${cf.end||'?'})`:''}`:'섭취 안 함'],
    ['운동',exs.length?exs.join(', '):'없음'],
    ['일정',`${esc((dy.type||[]).join(', ')||'-')} · 시험 ${esc(dy.exam||'-')} · 강도 ${dy.load||'-'}/5`],
    dy.note?['기타',esc(dy.note)]:null
  ].filter(Boolean);
  const head=a?`<div class="bnum">${dur(a.min)}</div>`:`<div class="bnum" style="font-size:20px">수면 기록 없음</div><div class="sub">하루 정리만 있어요. 아래 버튼으로 이 날 기록을 다시 남기면 수면과 하루 정리가 새 값으로 바뀌어요.</div>`;
  box.innerHTML=`<div class="ct">${title}</div>${head}<div style="height:12px"></div>`+rows.map(([k2,v])=>`<div class="drow"><span>${k2}</span><b>${v}</b></div>`).join('');
}
function updateBig(){
  const today=day0(new Date(Date.now()-5*3600e3));bigTarget=null;
  if(selDate&&selDate<today)bigTarget=selDate;
  let t,sb;
  if(bigTarget&&byDay.get(key(bigTarget))){t=`${bigTarget.getMonth()+1}/${bigTarget.getDate()} 수정하기`;sb='이미 남긴 기록을 고쳐요'}
  else if(bigTarget){t=`${bigTarget.getMonth()+1}/${bigTarget.getDate()} 기록 시작`;sb='빠트린 날의 기록을 남겨요'}
  else if(pending){t='기상 기록하기';sb='취침 후 이어서 기록해요'}
  else{t=`${today.getMonth()+1}/${today.getDate()} 기록 시작`;sb='취침 기록부터 시작해요'}
  $('#h-big').textContent=t;$('#h-sub').textContent=sb;
}
function showTab(t){
  tabNow=t;buzz(6);
  if(t==='stats'){location.href='stats.html';return}
  $('#tv-home').classList.add('on');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
function setMode(m){appEl.classList.toggle('home',m==='home');appEl.classList.toggle('flow',m==='flow')}
function startFlow(d){
  buzz(12);target=d||null;
  seq=target?[1,3,4,5,6,7,8]:(pending?[2,3,4,5,6,7,8]:[1,3,4,5,6,7,8]);
  const ck=document.querySelector('.chk');
  if(ck){ck.style.display=target?'none':'';P.sleepNow=!target;ck.classList.toggle('on',!target)}
  $('#app').classList.remove('fin');si=0;render(1);setMode('flow');
}
function goHome(){target=null;setMode('home');showTab(tabNow);refreshAll()}
$('#h-start').onclick=()=>startFlow(bigTarget);
function refreshAll(){
  RECS=collect(LS.get('sleep.cache',[]));renderHome();
  loadRemote().then(r=>{RECS=r;renderHome()});
}
if(startPage>=1&&startPage<=8)setMode('flow');
render(1);fitAll();flushOutbox();refreshAll();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
</script>
